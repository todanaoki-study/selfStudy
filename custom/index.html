<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MicroCMS テストページ</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header class="header">
        <h1 class="header__title">MicroCMS テストページ</h1>
    </header>

    <main class="main">
        <section class="articles">
            <h2 class="articles__title">記事</h2>
            <div class="articles__list">
                <img class="articles__item" src="https://placehold.jp/300x200.png" alt="記事画像1">
                <img class="articles__item" src="https://placehold.jp/300x200.png" alt="記事画像2">
                <img class="articles__item" src="https://placehold.jp/300x200.png" alt="記事画像3">
                <img class="articles__item" src="https://placehold.jp/300x200.png" alt="記事画像4">
                <img class="articles__item" src="https://placehold.jp/300x200.png" alt="記事画像5">
                <img class="articles__item" src="https://placehold.jp/300x200.png" alt="記事画像6">
            </div>
        </section>

        <section class="map">
            <h2 class="map__title">マップ</h2>
            <div class="map__container">
                <iframe class="map__iframe" src="https://maps.google.com/maps?q=東京駅&z=15&output=embed" width="100%"
                    height="300" frameborder="0"></iframe>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p class="footer__text">&copy; 2025 MicroCMS Test</p>
    </footer>

    <script defer src="js/index.js"></script>

</body>

</html>
